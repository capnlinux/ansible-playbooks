---
- name: Complete Linux Server Setup (WordPress Dedicated)
  hosts: localhost
  become: yes

  vars:
    mysql_root_password: "SecurePass123"
    wp_db_name: "wordpress"
    wp_db_user: "wp_user"
    wp_db_password: "WP_Secure_Password_2026!"

  tasks:
    - name: Update system
      apt:
        update_cache: yes
        upgrade: yes

    - name: Install essential packages
      apt:
        name:
          - nginx
          - mysql-server
          - php
          - php-mysql
          - php-fpm
          - php-curl
          - php-gd
          - php-intl
          - php-mbstring
          - php-soap
          - php-xml
          - php-xmlrpc
          - php-zip
          - ufw
          - fail2ban
          - git
          - curl
          - unzip
        state: present

    - name: Start and enable services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - nginx
        - mysql
        - fail2ban

    - name: Configure Firewall Rules
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '22'
        - '80'
        - '443'

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Ensure WordPress target directory exists
      file:
        path: /var/www/wordpress
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Download latest WordPress
      get_url:
        url: https://wordpress.org/latest.tar.gz
        dest: /tmp/wordpress.tar.gz

    - name: Extract WordPress archive
      unarchive:
        src: /tmp/wordpress.tar.gz
        dest: /var/www/
        remote_src: yes
        owner: www-data
        group: www-data

    - name: Deploy WordPress Nginx Configuration Template
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              root /var/www/wordpress;
              index index.php index.html index.htm;
              server_name _;

              location / {
                  try_files $uri $uri/ /index.php?$args;
              }

              location ~ \.php$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/var/run/php/php-fpm.sock;
              }

              location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                  expires max;
                  log_not_found off;
              }
          }
      notify: Reload Nginx

    - name: Remove any interfering default links if present
      file:
        path: /etc/nginx/sites-enabled/app.local
        state: absent
      notify: Reload Nginx

  handlers:
    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded

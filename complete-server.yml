---
- name: Complete Linux Server Setup
  hosts: localhost
  become: yes

  vars:
    mysql_root_password: "SecurePass123"
    domain_name: "myserver.local"

  tasks:

    - name: Update system
      apt:
        update_cache: yes
        upgrade: yes

    - name: Install essential packages
      apt:
        name:
          - nginx
          - mysql-server
          - php
          - php-mysql
          - php-fpm
          - ufw
          - fail2ban
          - git
          - curl
          - docker.io
        state: present

    - name: Start and enable services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - nginx
        - mysql
        - docker
        - fail2ban

    - name: Configure UFW default deny
      ufw:
        default: deny

    - name: Allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow HTTP
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Allow HTTPS
      ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Create web directory
      file:
        path: /var/www/html
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Create index page
      copy:
        content: "<h1>Server configured by Ansible!</h1>"
        dest: /var/www/html/index.html

    - name: Print completion message
      debug:
        msg: "Server setup complete! Nginx, MySQL, PHP, Docker, UFW, Fail2ban all configured."
